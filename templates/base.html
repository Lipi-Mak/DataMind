<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>
{% block title %}DataMind{% endblock %}
</title>

<!-- ============================
        FONTS
============================ -->

<link
rel="preconnect"
href="https://fonts.googleapis.com"
>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
rel="stylesheet"
>

<!-- ============================
        BOOTSTRAP
============================ -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<style>


/* ============================
        COLOR SYSTEM
============================ */

:root{

    --green-dark:#064E3B;

    --green:#065F46;

    --green-light:#D1FAE5;

    --green-soft:#ECFDF5;

    --teal:#0F766E;

    --amber:#D97706;

    --amber-soft:#FEF3C7;

    --text:#111827;

    --text-secondary:#475569;

    --text-muted:#64748B;

    --border:#E2E8F0;

    --background:#F4F7F6;

    --white:#FFFFFF;

}



/* ============================
        GLOBAL RESET
============================ */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}



body{

    font-family:'Inter',sans-serif;

    background:var(--background);

    color:var(--text);

    min-height:100vh;

}



/* ============================
        NAVBAR
============================ */

.navbar{

    background:var(--white);

    border-bottom:1px solid var(--border);

    padding:13px 0;

}



.brand{

    text-decoration:none;

    color:var(--text);

    font-family:'Space Grotesk',sans-serif;

    font-size:26px;

    font-weight:700;

    letter-spacing:-1px;

}



.brand span{

    color:var(--green-dark);

}



.tagline{

    color:var(--text-muted);

    font-size:12px;

    font-weight:400;

    margin-top:1px;

}



/* ============================
        NAVIGATION LINKS
============================ */

.nav-links{

    display:flex;

    gap:21px;

    align-items:center;

}



.nav-links a{

    position:relative;

    text-decoration:none;

    color:var(--text-secondary);

    font-size:13px;

    font-weight:500;

    transition:.2s ease;

}



.nav-links a:hover{

    color:var(--green-dark);

}



.nav-links a::after{

    content:"";

    position:absolute;

    left:0;

    bottom:-6px;

    width:0;

    height:2px;

    background:var(--green-dark);

    border-radius:2px;

    transition:.2s ease;

}



.nav-links a:hover::after{

    width:100%;

}



/* ============================
        MAIN
============================ */

main{

    width:92%;

    max-width:1200px;

    margin:auto;

    padding:30px 0;

}



/* ============================
        CARDS
============================ */

.card-modern{

    background:var(--white);

    border:1px solid rgba(226,232,240,.75);

    border-radius:12px;

    padding:17px;

    box-shadow:

        0 5px 18px rgba(15,23,42,.045);

}



.card-modern h3{

    font-size:17px;

    font-weight:700;

    margin-bottom:7px;

    color:var(--text);

}



.card-modern p{

    font-size:13px;

}



/* ============================
        BUTTONS
============================ */

.btn-primary-custom{

    background:var(--green-dark);

    color:white;

    border:none;

    border-radius:9px;

    padding:9px 19px;

    font-weight:600;

    font-size:13px;

    transition:.2s ease;

}



.btn-primary-custom:hover{

    background:#033C2D;

    color:white;

    transform:translateY(-1px);

}



.btn-primary-custom i{

    color:white !important;

}



/* ============================
        OUTLINE BUTTON
============================ */

.btn-outline-custom{

    background:var(--white);

    color:var(--green-dark);

    border:1px solid var(--green-dark);

    border-radius:9px;

    padding:9px 19px;

    font-weight:600;

    font-size:13px;

    transition:.2s ease;

}



.btn-outline-custom:hover{

    background:var(--green-dark);

    color:white;

}



.btn-outline-custom i{

    color:inherit;

}



/* ============================
        INPUTS
============================ */

input,
select,
textarea{

    border:1px solid #CBD5E1 !important;

    border-radius:9px !important;

    padding:9px !important;

    box-shadow:none !important;

    font-size:14px !important;

}



input:focus,
textarea:focus,
select:focus{

    border-color:var(--green-dark) !important;

    box-shadow:

        0 0 0 .15rem rgba(6,78,59,.12) !important;

}



/* ============================
        TABLES
============================ */

table{

    background:var(--white);

    border-radius:10px;

    overflow:hidden;

}



thead{

    background:var(--green-soft);

}



th{

    color:var(--green-dark);

    font-size:13px;

}



td{

    font-size:13px;

}



/* ============================
        TYPOGRAPHY
============================ */

h1{

    font-size:29px;

    font-weight:750;

    letter-spacing:-.5px;

    color:var(--text);

}



h2{

    font-size:23px;

    font-weight:700;

    color:var(--text);

}



h3{

    font-size:17px;

    font-weight:700;

    color:var(--text);

}



p{

    color:var(--text-muted);

    line-height:1.6;

}



/* ============================
        ICON COLORS
============================ */

.bi{

    color:var(--green-dark);

}



/* ============================
        BADGES
============================ */

.badge{

    background:var(--green-light) !important;

    color:var(--green-dark) !important;

    font-weight:600;

    font-size:11px;

    padding:5px 8px;

}



/* ============================
        AI EXPLANATION
============================ */

.ai-explanation{

    font-size:14px;

    line-height:1.8;

    color:#334155;

}



/* ============================
        AI ANSWERS
============================ */

.answer-text{

    font-size:15px;

    line-height:1.8;

    color:#111827;

}



/* ============================
        AI HEADINGS
============================ */

.ai-heading{

    display:block;

    color:var(--green-dark);

    font-weight:700;

    font-size:15px;

    margin-top:17px;

    margin-bottom:5px;

}



/* ============================
        AI ANSWER BOX
============================ */

.answer-box{

    background:var(--green-soft);

    border-left:4px solid var(--green-dark);

    border-radius:9px;

    padding:16px 18px;

}



.answer-box .answer-text{

    color:#17201D;

}



/* ============================
        WARNING / ACCENT
============================ */

.accent-label{

    color:var(--amber);

    font-weight:700;

}



/* ============================
        PAGE ANIMATION
============================ */

.page{

    animation:fade .3s ease;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(7px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* ============================
        MOBILE
============================ */

@media (max-width:900px){

    .navbar .container{

        flex-direction:column;

        align-items:flex-start !important;

        gap:12px;

    }


    .nav-links{

        flex-wrap:wrap;

        gap:14px;

    }


    main{

        width:94%;

        padding:24px 0;

    }

}



</style>

</head>

<body>

<!-- ============================
        NAVBAR
============================ -->

<nav class="navbar">

<div class="container d-flex justify-content-between align-items-center">

<div>

<a
href="/"
class="brand"

>

Data<span>Mind</span>

</a>

<div class="tagline">

Your AI Data Analyst

</div>

</div>

<div class="nav-links">

<a href="{{ url_for('overview') }}">
Overview
</a>

<a href="{{ url_for('quality') }}">
Quality
</a>

<a href="{{ url_for('visualizations') }}">
Visualizations
</a>

<a href="{{ url_for('insights') }}">
AI Insights
</a>

<a href="{{ url_for('ask') }}">
Ask DataMind
</a>

</div>

</div>

</nav>

<!-- ============================
        PAGE CONTENT
============================ -->

<main class="page">

{% block content %}

{% endblock %}

</main>

</body>

</html>
